spring.application.name=explore-india-backend
server.port=8080

# Database Configuration (MySQL 8+ / MariaDB XAMPP)
# Target Database: explore_india
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/explore_india?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=./uploads

# Security / JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Swagger / OpenAPI 3
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
